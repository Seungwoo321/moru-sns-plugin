name: Moru v2 isolated connections
on:
  pull_request:
    paths: ['services/moru_v2/**', '.github/workflows/moru-v2.yml']
  push:
    branches: [master]
    paths: ['services/moru_v2/**', '.github/workflows/moru-v2.yml']
permissions:
  contents: read
jobs:
  connections:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: moru_v2_test
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/moru_v2/requirements.txt pytest==9.2.0
      - run: python -m pytest services/moru_v2/tests -q
      - run: python -m pytest services/moru_v2/tests -q
        env:
          MORU_V2_TEST_DATABASE_URL: postgresql+psycopg://fixture:fixture-only@localhost:5432/moru_v2_test
      - run: python scripts/check_package.py
      - run: python -m unittest discover -s plugins/moru-sns/remote -p 'test_*.py'
      - run: python -m unittest discover -s plugins/moru-sns/skills/sns-direct-publisher/scripts -p 'test_*.py'
